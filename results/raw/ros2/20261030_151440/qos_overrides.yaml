# QoS overrides for `ros2 bag play`, used for every ROS2 replay.
# Overriding all replayed topics makes the publisher QoS identical whether the bag was
# recorded on ROS2 or converted from ROS1 (converted bags carry no QoS profiles, which
# would replay /tf_static as volatile and break tf2 listeners that ask for transient_local).
/tf_static:
  history: keep_last
  depth: 100
  reliability: reliable
  durability: transient_local
/tf:
  history: keep_last
  depth: 100
  reliability: reliable
  durability: volatile
/scan:
  history: keep_last
  depth: 10
  reliability: reliable
  durability: volatile
/odom:
  history: keep_last
  depth: 50
  reliability: reliable
  durability: volatile
